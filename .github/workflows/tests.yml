name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Run linting (ruff)
      run: |
        uv run ruff check meshmap/ tests/
      continue-on-error: true

    - name: Run type checking (mypy)
      run: |
        uv run mypy meshmap/
      continue-on-error: true

    - name: Run all tests with coverage
      run: |
        # Always run the full test suite
        uv run pytest tests/ -v --cov=meshmap --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

    - name: Generate coverage badge
      if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
      run: |
        echo "Coverage report generated"
        uv run coverage report

  test-macos:
    name: Test on macOS (Python 3.12)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Run all tests
      run: |
        # Full test suite on macOS
        uv run pytest tests/ -v --cov=meshmap --cov-report=term

  check-formatting:
    name: Check code formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install ruff
      run: |
        uv pip install --system ruff

    - name: Check formatting
      run: |
        uv run ruff format --check meshmap/ tests/
